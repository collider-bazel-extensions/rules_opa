name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  linux:
    name: bazel test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: bazel build //...
        run: bazel build //...

      - name: bazel test //... (analysis + end-to-end opa_test/opa_fmt_check)
        # No `manual` filter — the example tests run real `opa test` and
        # `opa fmt -d` against tests/example/*.rego, exercising the full
        # rule path end-to-end.
        run: bazel test //... --test_output=errors

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bazel-testlogs
          path: bazel-testlogs/
          if-no-files-found: ignore

  consumer:
    # rules_opa as a dependency, from the commit's git archive: a root
    # without opa.version() resolves, repeated / unsupported versions,
    # and @rules_opa//... loads.
    name: consumer (ubuntu-latest, git archive)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          repository-cache: true

      - name: Consumer checks
        run: .github/consumer/check.sh "$RUNNER_TEMP/consumer"
